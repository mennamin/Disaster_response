<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Details | Disaster Response System</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-mark">DR</div>
    <div>
      <div class="brand-name">Disaster Response System</div>
      <div class="brand-subtitle">Incident Management Prototype</div>
    </div>
    <span class="prototype-tag">Phase 1 Prototype</span>
  </header>

  <main class="page-wrap">
    <a class="back-link" href="reports.html">← Back to reports</a>

    <div class="page-heading details-heading">
      <div>
        <p class="eyebrow">REPORT DETAILS</p>
        <h1>Full Incident Details</h1>
        <p class="intro">Review the information recorded for this incident.</p>
      </div>
      <span id="details-report-id" class="report-id-pill">Report</span>
    </div>

    <section id="report-details" class="panel details-panel">
      <!-- Report information is added by script.js from hardcoded sample data. -->
    </section>

    <p class="page-footnote">Phase 1 demonstration · Sample data only · No database or backend is connected.</p>
  </main>
